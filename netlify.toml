[build]
  base = "configurator-app"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep this deploy out of search engines: it is the configurator backend
# embedded by dspln.com, not a site anyone should discover directly.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Anyone who lands on the bare domain belongs on the real store. The store
# embeds use explicit /configurator/* paths, which the SPA fallback below
# keeps serving as before.
# academy.dspln.com is the academies' front door and serves the app at its
# root. This must come before the bare-domain rule below, which would
# otherwise send it to the Shopify store.
[[redirects]]
  from = "https://academy.dspln.com/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "https://dspln.com"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
